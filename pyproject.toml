[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crc16-modbus"
version = "0.1.0"
description = "Pure-Python CRC-16/Modbus reference implementation, zero runtime deps"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/prasad-a-abhishek/crc16-modbus-pure"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
